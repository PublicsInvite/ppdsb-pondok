<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Pondok Pesantren</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">🕌 Pondok Pesantren</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/daftar">Daftar</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/admin">Admin</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Dashboard Content -->
    <div class="container-fluid py-4">
      <h2 class="mb-4">Dashboard Admin - Data Pendaftar</h2>

      <!-- Filter & Search -->
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <input
                type="text"
                class="form-control"
                id="searchInput"
                placeholder="🔍 Cari nama, email, atau no HP..."
              />
            </div>
            <div class="col-md-3">
              <select class="form-select" id="statusFilter">
                <option value="">Semua Status</option>
                <option value="pending">Pending</option>
                <option value="diterima">Diterima</option>
                <option value="ditolak">Ditolak</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-primary w-100" id="filterBtn">
                <i class="bi bi-funnel"></i> Filter
              </button>
            </div>
            <div class="col-md-3">
              <button class="btn btn-success w-100" id="refreshBtn">
                <i class="bi bi-arrow-clockwise"></i> Refresh
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Stats Cards -->
      <div class="row mb-4" id="statsCards">
        <div class="col-md-3">
          <div class="card text-white bg-primary">
            <div class="card-body">
              <h6 class="card-title">Total Pendaftar</h6>
              <h3 id="totalCount">-</h3>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-white bg-warning">
            <div class="card-body">
              <h6 class="card-title">Pending</h6>
              <h3 id="pendingCount">-</h3>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-white bg-success">
            <div class="card-body">
              <h6 class="card-title">Diterima</h6>
              <h3 id="diterimaCount">-</h3>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-white bg-danger">
            <div class="card-body">
              <h6 class="card-title">Ditolak</h6>
              <h3 id="ditolakCount">-</h3>
            </div>
          </div>
        </div>
      </div>

      <!-- Data Table -->
      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>Nama</th>
                  <th>Email</th>
                  <th>No HP</th>
                  <th>Alamat</th>
                  <th>Status</th>
                  <th>Tanggal</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr>
                  <td colspan="8" class="text-center">
                    <div class="spinner-border text-primary" role="status">
                      <span class="visually-hidden">Loading...</span>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <nav
            aria-label="Page navigation"
            id="paginationContainer"
            class="mt-3"
          >
            <ul class="pagination justify-content-center" id="pagination"></ul>
          </nav>
        </div>
      </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal fade" id="detailModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Detail Pendaftar</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="detailModalBody">
            <!-- Content will be populated by JavaScript -->
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="/assets/js/app.js"></script>

    <script>
      let currentPage = 1;
      let currentSearch = "";
      let currentStatus = "";

      // Load data on page load
      window.addEventListener("DOMContentLoaded", () => {
        loadData();
      });

      // Filter button
      document.getElementById("filterBtn").addEventListener("click", () => {
        currentPage = 1;
        currentSearch = document.getElementById("searchInput").value;
        currentStatus = document.getElementById("statusFilter").value;
        loadData();
      });

      // Refresh button
      document.getElementById("refreshBtn").addEventListener("click", () => {
        currentPage = 1;
        currentSearch = "";
        currentStatus = "";
        document.getElementById("searchInput").value = "";
        document.getElementById("statusFilter").value = "";
        loadData();
      });

      // Search on Enter
      document
        .getElementById("searchInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            document.getElementById("filterBtn").click();
          }
        });

      async function loadData() {
        try {
          const params = new URLSearchParams({
            page: currentPage,
            limit: 10,
            search: currentSearch,
            status: currentStatus,
          });

          const response = await fetch(`/api/pendaftar_list?${params}`);
          const result = await response.json();

          if (result.success) {
            renderTable(result.data);
            renderPagination(result.total, result.limit);
            updateStats(result.data);
          } else {
            throw new Error(result.error);
          }
        } catch (error) {
          document.getElementById("tableBody").innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center text-danger">
                            Error: ${error.message}
                        </td>
                    </tr>
                `;
        }
      }

      function renderTable(data) {
        const tbody = document.getElementById("tableBody");

        if (data.length === 0) {
          tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center">Tidak ada data</td>
                    </tr>
                `;
          return;
        }

        tbody.innerHTML = data
          .map(
            (item, index) => `
                <tr>
                    <td>${(currentPage - 1) * 10 + index + 1}</td>
                    <td>${item.nama}</td>
                    <td>${item.email}</td>
                    <td>${item.no_hp}</td>
                    <td>${item.alamat.substring(0, 30)}...</td>
                    <td>
                        <span class="badge bg-${getStatusColor(item.status)}">
                            ${item.status}
                        </span>
                    </td>
                    <td>${new Date(item.created_at).toLocaleDateString(
                      "id-ID"
                    )}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="showDetail(${
                          item.id
                        })">
                            <i class="bi bi-eye"></i>
                        </button>
                        ${
                          item.status === "pending"
                            ? `
                            <button class="btn btn-sm btn-success" onclick="updateStatus(${item.id}, 'diterima')">
                                <i class="bi bi-check"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="updateStatus(${item.id}, 'ditolak')">
                                <i class="bi bi-x"></i>
                            </button>
                        `
                            : ""
                        }
                    </td>
                </tr>
            `
          )
          .join("");
      }

      function renderPagination(total, limit) {
        const totalPages = Math.ceil(total / limit);
        const pagination = document.getElementById("pagination");

        if (totalPages <= 1) {
          pagination.innerHTML = "";
          return;
        }

        let html = "";

        // Previous button
        html += `
                <li class="page-item ${currentPage === 1 ? "disabled" : ""}">
                    <a class="page-link" href="#" onclick="changePage(${
                      currentPage - 1
                    }); return false;">Previous</a>
                </li>
            `;

        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
          if (
            i === 1 ||
            i === totalPages ||
            (i >= currentPage - 2 && i <= currentPage + 2)
          ) {
            html += `
                        <li class="page-item ${
                          i === currentPage ? "active" : ""
                        }">
                            <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                        </li>
                    `;
          } else if (i === currentPage - 3 || i === currentPage + 3) {
            html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
          }
        }

        // Next button
        html += `
                <li class="page-item ${
                  currentPage === totalPages ? "disabled" : ""
                }">
                    <a class="page-link" href="#" onclick="changePage(${
                      currentPage + 1
                    }); return false;">Next</a>
                </li>
            `;

        pagination.innerHTML = html;
      }

      function updateStats(data) {
        // This is a simple client-side calculation
        // For accurate stats, you might want to create a separate API endpoint
        document.getElementById("totalCount").textContent = data.length;
        document.getElementById("pendingCount").textContent = data.filter(
          (d) => d.status === "pending"
        ).length;
        document.getElementById("diterimaCount").textContent = data.filter(
          (d) => d.status === "diterima"
        ).length;
        document.getElementById("ditolakCount").textContent = data.filter(
          (d) => d.status === "ditolak"
        ).length;
      }

      function getStatusColor(status) {
        const colors = {
          pending: "warning",
          diterima: "success",
          ditolak: "danger",
        };
        return colors[status] || "secondary";
      }

      function changePage(page) {
        currentPage = page;
        loadData();
      }

      async function updateStatus(id, status) {
        if (!confirm(`Yakin ingin mengubah status menjadi "${status}"?`)) {
          return;
        }

        try {
          const response = await fetch("/api/pendaftar_status", {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ id, status }),
          });

          const result = await response.json();

          if (result.success) {
            alert("Status berhasil diupdate!");
            loadData();
          } else {
            throw new Error(result.error);
          }
        } catch (error) {
          alert("Error: " + error.message);
        }
      }

      function showDetail(id) {
        // Find the data from current loaded data
        fetch(`/api/pendaftar_list?page=1&limit=1000`)
          .then((res) => res.json())
          .then((result) => {
            const item = result.data.find((d) => d.id === id);
            if (item) {
              document.getElementById("detailModalBody").innerHTML = `
                            <dl class="row">
                                <dt class="col-sm-3">Nama</dt>
                                <dd class="col-sm-9">${item.nama}</dd>
                                
                                <dt class="col-sm-3">Email</dt>
                                <dd class="col-sm-9">${item.email}</dd>
                                
                                <dt class="col-sm-3">No HP</dt>
                                <dd class="col-sm-9">${item.no_hp}</dd>
                                
                                <dt class="col-sm-3">Alamat</dt>
                                <dd class="col-sm-9">${item.alamat}</dd>
                                
                                <dt class="col-sm-3">Alasan</dt>
                                <dd class="col-sm-9">${item.alasan}</dd>
                                
                                <dt class="col-sm-3">Status</dt>
                                <dd class="col-sm-9">
                                    <span class="badge bg-${getStatusColor(
                                      item.status
                                    )}">${item.status}</span>
                                </dd>
                                
                                <dt class="col-sm-3">Tanggal Daftar</dt>
                                <dd class="col-sm-9">${new Date(
                                  item.created_at
                                ).toLocaleString("id-ID")}</dd>
                            </dl>
                        `;

              const modal = new bootstrap.Modal(
                document.getElementById("detailModal")
              );
              modal.show();
            }
          });
      }
    </script>
  </body>
</html>
