<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cek Status Pendaftaran - Pondok Pesantren</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/styles.css" />

    <style>
      .status-card {
        border-left: 5px solid;
        margin-top: 2rem;
      }
      .status-pending {
        border-color: #ffc107;
      }
      .status-diterima {
        border-color: #28a745;
      }
      .status-ditolak {
        border-color: #dc3545;
      }
      .hero-section {
        background: linear-gradient(135deg, #0f9d58 0%, #1b5e20 100%);
        color: white;
        padding: 4rem 0;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">🕌 Pondok Kita</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/daftar">Daftar</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/cek-status">Cek Status</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/login">Admin</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
      <div class="container text-center">
        <h1 class="display-5 fw-bold mb-3">
          <i class="bi bi-search"></i> Cek Status Pendaftaran
        </h1>
        <p class="lead">
          Masukkan nomor registrasi Anda untuk melihat status pendaftaran
        </p>
      </div>
    </section>

    <!-- Main Content -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <!-- Form Cek Status -->
          <div class="card shadow">
            <div class="card-body p-4">
              <h5 class="card-title mb-4">
                <i class="bi bi-card-text text-success"></i> Cek Status Anda
              </h5>

              <form id="cekStatusForm">
                <div class="mb-4">
                  <label for="nomorRegistrasi" class="form-label fw-bold"
                    >Nomor Registrasi</label
                  >
                  <input
                    type="text"
                    class="form-control form-control-lg"
                    id="nomorRegistrasi"
                    placeholder="REG-20241014-000001"
                    required
                  />
                  <div class="form-text">
                    Format: REG-YYYYMMDD-XXXXXX (contoh: REG-20241014-000001)
                  </div>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100">
                  <i class="bi bi-search"></i> Cek Status
                </button>
              </form>

              <!-- Loading -->
              <div id="loading" class="text-center mt-4" style="display: none">
                <div class="spinner-border text-success" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2 text-muted">Mencari data...</p>
              </div>

              <!-- Error Alert -->
              <div
                id="errorAlert"
                class="alert alert-danger mt-4"
                style="display: none"
              >
                <i class="bi bi-exclamation-triangle"></i>
                <span id="errorMessage"></span>
              </div>
            </div>
          </div>

          <!-- Result Card -->
          <div id="resultCard" style="display: none"></div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document
        .getElementById("cekStatusForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const nomorRegistrasi = document
            .getElementById("nomorRegistrasi")
            .value.trim();
          const loading = document.getElementById("loading");
          const errorAlert = document.getElementById("errorAlert");
          const resultCard = document.getElementById("resultCard");

          // Reset
          loading.style.display = "block";
          errorAlert.style.display = "none";
          resultCard.style.display = "none";

          try {
            const response = await fetch(
              `/api/pendaftar_cek_status?nomor=${encodeURIComponent(
                nomorRegistrasi
              )}`
            );
            const result = await response.json();

            loading.style.display = "none";

            if (result.success && result.data) {
              showResult(result.data);
            } else {
              showError(
                result.error ||
                  "Nomor registrasi tidak ditemukan. Pastikan Anda memasukkan nomor yang benar."
              );
            }
          } catch (error) {
            loading.style.display = "none";
            showError("Terjadi kesalahan: " + error.message);
          }
        });

      function showResult(data) {
        const statusClass =
          data.status === "pending"
            ? "status-pending"
            : data.status === "diterima"
            ? "status-diterima"
            : "status-ditolak";
        const statusBadge =
          data.status === "pending"
            ? "warning"
            : data.status === "diterima"
            ? "success"
            : "danger";
        const statusIcon =
          data.status === "pending"
            ? "hourglass-split"
            : data.status === "diterima"
            ? "check-circle"
            : "x-circle";
        const statusText =
          data.status === "pending"
            ? "Menunggu Verifikasi"
            : data.status === "diterima"
            ? "Diterima"
            : "Ditolak";

        document.getElementById("resultCard").innerHTML = `
                <div class="card shadow-lg status-card ${statusClass} mt-4">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-${statusIcon} text-${statusBadge}" style="font-size: 4rem;"></i>
                            <h3 class="mt-3">Status: <span class="badge bg-${statusBadge}">${statusText}</span></h3>
                        </div>

                        <hr>

                        <dl class="row mb-0">
                            <dt class="col-sm-5">Nomor Registrasi</dt>
                            <dd class="col-sm-7"><strong>${
                              data.nomorRegistrasi
                            }</strong></dd>

                            <dt class="col-sm-5">Nama Lengkap</dt>
                            <dd class="col-sm-7">${data.nama}</dd>

                            <dt class="col-sm-5">NIK</dt>
                            <dd class="col-sm-7">${data.nik}</dd>

                            <dt class="col-sm-5">Tanggal Lahir</dt>
                            <dd class="col-sm-7">${new Date(
                              data.tanggalLahir
                            ).toLocaleDateString("id-ID", {
                              day: "numeric",
                              month: "long",
                              year: "numeric",
                            })}</dd>

                            <dt class="col-sm-5">Tanggal Daftar</dt>
                            <dd class="col-sm-7">${new Date(
                              data.created_at
                            ).toLocaleString("id-ID")}</dd>

                            ${
                              data.alasan
                                ? `
                                <dt class="col-sm-5">Keterangan</dt>
                                <dd class="col-sm-7">${data.alasan}</dd>
                            `
                                : ""
                            }
                        </dl>

                        ${
                          data.status === "pending"
                            ? `
                            <div class="alert alert-info mt-4 mb-0">
                                <i class="bi bi-info-circle"></i>
                                <strong>Status sedang diproses.</strong> Mohon tunggu konfirmasi dari admin.
                            </div>
                        `
                            : ""
                        }

                        ${
                          data.status === "diterima"
                            ? `
                            <div class="alert alert-success mt-4">
                                <i class="bi bi-check-circle"></i>
                                <strong>Selamat!</strong> Pendaftaran Anda telah diterima. 
                            </div>
                            <div class="d-grid gap-2 mt-3">
                                <a href="/pembayaran.html?nomor=${encodeURIComponent(
                                  data.nomorRegistrasi
                                )}&nama=${encodeURIComponent(data.nama)}" 
                                   class="btn btn-success btn-lg">
                                    <i class="bi bi-credit-card"></i> Lanjut ke Pembayaran
                                </a>
                            </div>
                        `
                            : ""
                        }

                        ${
                          data.status === "ditolak"
                            ? `
                            <div class="alert alert-danger mt-4 mb-0">
                                <i class="bi bi-x-circle"></i>
                                <strong>Maaf,</strong> pendaftaran Anda belum dapat diproses saat ini.
                            </div>
                        `
                            : ""
                        }
                    </div>
                </div>
            `;

        document.getElementById("resultCard").style.display = "block";
      }

      function showError(message) {
        document.getElementById("errorMessage").textContent = message;
        document.getElementById("errorAlert").style.display = "block";
      }
    </script>
  </body>
</html>
